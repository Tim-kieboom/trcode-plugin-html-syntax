id = "html-syntax"
name = "HTML"
version = "0.0.2"
abi = "1.13"
# A language and nothing else: no module of its own and no pane. The grammar is the file the
# installer downloads and checks.

[language]
name = "HTML"
grammar = "html.wasm"
extensions = ["html", "htm", "xhtml"]
# The query is the grammar's own (queries/highlights.scm of https://github.com/tree-sitter/tree-sitter-html, master 73a3947 (after v0.23.2)),
# with the capture names the theme has (`tag` is `keyword`), and its patterns in the opposite order
# of the grammar's file: TerminalCode takes the first of two patterns on the same text, and that
# file is written for the last (as Neovim and Zed take it).
highlights = '''
[
  "<"
  ">"
  "</"
  "/>"
] @punctuation.bracket

(comment) @comment

(attribute_value) @string

(attribute_name) @attribute

(doctype) @constant

(erroneous_end_tag_name) @keyword

(tag_name) @keyword
'''

# The text of a <script> is JavaScript (built into TerminalCode) and the text of a <style> is CSS
# (the css-syntax plugin, which has to be on for it to be colored).
injections = '''
((script_element
   (raw_text) @injection.content)
 (#set! injection.language "javascript"))

((style_element
   (raw_text) @injection.content)
 (#set! injection.language "css"))
'''
